name: Check site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Links, diagram specs and math delimiters
        run: python scripts/check_site.py
      - name: JavaScript syntax
        run: |
          node --check assets/site.js
          node --check assets/automata.js
